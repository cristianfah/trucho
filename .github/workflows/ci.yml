name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Ingestion (pytest + ruff)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: trucho
          POSTGRES_PASSWORD: trucho
          POSTGRES_DB: trucho_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trucho"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
        env:
          TRUCHO_TEST_DATABASE_URL: postgresql://trucho:trucho@localhost:5432/trucho_test

  typescript:
    name: Schema (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
