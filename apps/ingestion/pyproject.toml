[project]
name = "trucho-ingest"
version = "0.1.0"
description = "Pipeline de ingesta de Trucho: scrape → dedupe → enrichment LLM → embed → load"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.10",
    "selectolax>=0.3.21",
    "typer>=0.15",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=3.2",
]

[project.scripts]
trucho = "trucho_ingest.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trucho_ingest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
